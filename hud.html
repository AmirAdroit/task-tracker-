<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quest HUD</title>
<style>
  :root{
    --panel-alpha:0.60;
    --bg-panel: rgba(18,18,22,var(--panel-alpha));
    --bg-slab: rgba(255,255,255,0.05);
    --bg-slab-hi: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.11);
    --border: rgba(255,255,255,0.18);
    --text: #ededf2; --text-dim:#9a9aa4; --accent:#6e8efb; --xp:#6e8efb; --xp-2:#9db4ff; --good:#7fd08a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:transparent;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);
    -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;}

  .panel{height:100vh;width:100vw;background:var(--bg-panel);
    backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
    border:1px solid var(--border-soft);border-top:none;border-radius:0 0 12px 12px;
    padding:11px 12px 13px;display:flex;flex-direction:column;gap:11px;}
  .panel.solid{background:rgb(24,24,28);backdrop-filter:none;-webkit-backdrop-filter:none;}

  .head{display:flex;align-items:center;gap:10px;}
  .avatar{width:40px;height:40px;border-radius:50%;flex:none;background:#2a2a33;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;color:var(--accent);}
  .who{flex:1;min-width:0;}
  .who .name{font-weight:600;font-size:15px;line-height:1.1;}
  .who .sub{font-size:11px;color:var(--text-dim);display:flex;gap:7px;align-items:center;margin-top:3px;}
  .lvl-pill{font-weight:600;font-size:11px;color:#10131c;background:var(--accent);padding:1px 7px;border-radius:20px;}
  .hbtns{display:flex;gap:5px;}
  .ibtn{width:24px;height:24px;border-radius:7px;border:1px solid var(--border-soft);background:var(--bg-slab);
    color:var(--text-dim);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .ibtn:hover{background:var(--bg-slab-hi);color:var(--text);}
  .ibtn.on{color:var(--accent);border-color:var(--accent);}

  .settings{display:none;flex-direction:column;gap:9px;background:var(--bg-slab);border:1px solid var(--border-soft);
    border-radius:9px;padding:10px;}
  .settings.open{display:flex;}
  .setrow{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text-dim);}
  .setrow .grow{flex:1;}
  .toggle{position:relative;width:38px;height:20px;border-radius:20px;background:rgba(255,255,255,0.15);
    cursor:pointer;transition:.15s;flex:none;}
  .toggle.on{background:var(--accent);}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#fff;transition:.15s;}
  .toggle.on::after{left:20px;}
  input[type=range]{flex:1;accent-color:var(--accent);}
  .linkbtn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;
    padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;width:100%;}
  .linkbtn:hover{background:var(--bg-slab-hi);}

  .bars{display:flex;flex-direction:column;gap:6px;}
  .bar-row{display:flex;align-items:center;gap:8px;}
  .bar-label{font-size:10px;color:var(--text-dim);width:24px;text-transform:uppercase;letter-spacing:.6px;}
  .bar{flex:1;height:7px;border-radius:20px;overflow:hidden;background:rgba(0,0,0,0.35);border:1px solid var(--border-soft);}
  .bar>span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--xp),var(--xp-2));}
  .bar-val{font-size:10px;color:var(--text-dim);width:66px;text-align:right;font-variant-numeric:tabular-nums;}
  .gold-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
  .gold-line .g{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;font-size:13px;}

  /* pager */
  .pager{display:flex;align-items:center;gap:6px;background:var(--bg-slab);border:1px solid var(--border-soft);
    border-radius:9px;padding:5px 7px;}
  .pager .arrow{width:22px;height:22px;flex:none;border:none;background:transparent;color:var(--text-dim);
    cursor:pointer;font-size:15px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
  .pager .arrow:hover{background:var(--bg-slab-hi);color:var(--text);}
  .pager .lens{flex:1;text-align:center;}
  .pager .lens .nm{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  .pager .lens .ct{font-size:10px;color:var(--text-dim);margin-left:5px;}
  .pager .funnel{width:22px;height:22px;flex:none;border:none;background:transparent;color:var(--text-dim);
    cursor:pointer;font-size:12px;border-radius:6px;}
  .pager .funnel:hover,.pager .funnel.on{color:var(--accent);}
  .dots{display:flex;gap:4px;justify-content:center;margin-top:-4px;}
  .dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.22);}
  .dots span.on{background:var(--accent);}

  .catfilter{display:none;flex-wrap:wrap;gap:5px;margin-top:-3px;}
  .catfilter.open{display:flex;}
  .catchip{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-dim);cursor:pointer;
    border:1px solid var(--border-soft);background:var(--bg-slab);border-radius:20px;padding:2px 8px;}
  .catchip .cd{width:7px;height:7px;border-radius:50%;}
  .catchip.on{color:var(--text);border-color:var(--accent);background:var(--bg-slab-hi);}

  .sec-title{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-dim);
    display:flex;align-items:center;gap:7px;margin:1px 0;}
  .sec-title::before{content:"";flex:none;width:11px;height:1px;background:var(--accent);opacity:.5;}

  .scroll{overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;}
  .scroll::-webkit-scrollbar{width:5px;}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:5px;}
  .quests{flex:1;min-height:60px;}

  .quest{background:var(--bg-slab);border:1px solid var(--border-soft);border-left:3px solid var(--u,#888);
    border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:4px;}
  .quest.active{background:var(--bg-slab-hi);border-color:var(--border);border-left-color:var(--u,#888);}
  .q-top{display:flex;align-items:center;gap:7px;}
  .q-title{font-size:12.5px;font-weight:500;line-height:1.25;flex:1;min-width:0;}
  .due-chip{flex:none;font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:6px;white-space:nowrap;}
  .q-obj{font-size:11px;color:var(--text-dim);line-height:1.3;}
  .q-meta{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--text-dim);flex-wrap:wrap;}
  .q-meta .xp-tag{color:var(--xp-2);}
  .cat-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .q-meta .cat{display:flex;align-items:center;gap:4px;}
  .q-spacer{flex:1;}
  .timer{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;}
  .qbtn{font-size:11px;font-weight:500;cursor:pointer;border-radius:7px;padding:3px 9px;
    border:1px solid var(--border-soft);background:var(--bg-slab-hi);color:var(--text);transition:.15s;}
  .qbtn:hover{filter:brightness(1.18);}
  .qbtn.start{border-color:var(--accent);color:var(--accent);}
  .qbtn.done{border-color:rgba(127,208,138,0.5);color:var(--good);}
  .qbtn.act{border-color:var(--accent);color:var(--accent);}
  .more{flex:none;width:22px;height:22px;border:1px solid var(--border-soft);background:transparent;color:var(--text-dim);
    cursor:pointer;border-radius:7px;font-size:13px;line-height:1;}
  .more:hover,.more.on{color:var(--text);background:var(--bg-slab-hi);}

  .q-edit{display:none;flex-direction:column;gap:7px;margin-top:5px;padding-top:7px;border-top:1px solid var(--border-soft);}
  .q-edit.open{display:flex;}
  .erow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--text-dim);}
  .erow label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;}
  .q-edit select,.q-edit input[type=date]{background:var(--bg-slab);border:1px solid var(--border-soft);border-radius:6px;
    color:var(--text);padding:3px 5px;font-size:11px;font-family:inherit;outline:none;}
  .q-edit select:focus,.q-edit input:focus{border-color:var(--accent);}
  .chipbtn{font-size:10.5px;cursor:pointer;border-radius:6px;padding:2px 7px;border:1px solid var(--border-soft);
    background:var(--bg-slab);color:var(--text-dim);font-family:inherit;}
  .chipbtn:hover{color:var(--text);background:var(--bg-slab-hi);}
  .chipbtn.danger{border-color:rgba(226,75,74,0.45);color:#e88;}
  .chipbtn.pin.on{border-color:#e24b4a;color:#e24b4a;}

  .logitem{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:4px 1px;border-bottom:1px solid var(--border-soft);}
  .logitem:last-child{border-bottom:none;}
  .logitem .chk{color:var(--good);flex:none;}
  .logitem .lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .logitem .ld,.logitem .lw{color:var(--text-dim);font-size:10.5px;font-variant-numeric:tabular-nums;}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
  .stat{background:var(--bg-slab);border:1px solid var(--border-soft);border-radius:8px;padding:4px 4px;text-align:center;}
  .stat .v{font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;}
  .stat .k{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}

  .ach{display:flex;gap:6px;flex-wrap:wrap;}
  .badge{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;
    border:1px solid var(--border-soft);background:var(--bg-slab);color:var(--text-dim);position:relative;}
  .badge.on{color:var(--accent);border-color:var(--border);background:var(--bg-slab-hi);}
  .badge .tip{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.88);color:#fff;
    font-size:10.5px;padding:4px 7px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:5;}
  .badge:hover .tip{opacity:1;}

  .add{display:flex;gap:5px;}
  .add input{flex:1;background:var(--bg-slab);border:1px solid var(--border-soft);border-radius:8px;color:var(--text);
    padding:6px 9px;font-size:12px;font-family:inherit;outline:none;}
  .add input:focus{border-color:var(--accent);}
  .add input::placeholder{color:var(--text-dim);}
  .add button{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;width:32px;cursor:pointer;font-size:15px;}
  .add button:hover{background:var(--bg-slab-hi);}

  .empty{color:var(--text-dim);font-size:11px;padding:8px 2px;text-align:center;}
  .collapsed .collapsible{display:none;}
  .toast{position:absolute;top:10px;left:50%;transform:translateX(-50%) translateY(-16px);background:rgba(20,22,30,0.95);
    border:1px solid var(--accent);color:var(--accent);font-weight:600;letter-spacing:.5px;padding:7px 16px;border-radius:10px;
    opacity:0;pointer-events:none;transition:.3s;z-index:50;font-size:13px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .pending-review{font-size:11px;color:#efb477;border:1px solid #766447;border-radius:7px;padding:5px;cursor:pointer;background:transparent;}
  dialog{background:#191c27;color:#ededf2;border:1px solid #6476a8;border-radius:12px;padding:16px;width:calc(100vw - 18px);max-height:95vh;}
  dialog::backdrop{background:#080b14aa}dialog h2{font-size:15px;margin:0}dialog header,dialog footer,.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}dialog footer{margin:12px 0 0}dialog label{display:flex;flex-direction:column;gap:5px;margin:10px 0;font-size:12px}dialog input,dialog select,dialog textarea{background:#10131c;border:1px solid #4a536f;border-radius:6px;color:white;padding:6px;max-width:100%;width:100%;font:inherit}dialog button{background:#29324b;color:white;border:1px solid #6476a8;border-radius:6px;padding:5px;cursor:pointer;font:inherit}dialog textarea{min-height:60px}#form-error{color:#ffaaaa}#notice{position:fixed;bottom:10px;left:10px;right:10px;background:#29324b;border:1px solid #8ca4ff;padding:9px;border-radius:7px;z-index:99;font-size:12px}.session{font-size:11px;border-top:1px solid #444;padding:8px 0}.session p{margin:4px 0}.session button{font-size:10px;padding:3px}.session .actions{display:flex;gap:4px;flex-wrap:wrap}.pill{font-size:9px;margin-left:6px;color:#aab8dd}.warning{color:#efb477}.q-title,.q-obj{unicode-bidi:plaintext}button:focus-visible,input:focus-visible{outline:2px solid #8ca4ff}
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="head">
      <div class="avatar">X</div>
      <div class="who">
        <div class="name">Xerex</div>
        <div class="sub"><span class="lvl-pill">Lv <span id="lvl">1</span></span><span id="title-line">Adventurer</span></div>
      </div>
      <div class="hbtns">
        <button class="ibtn" id="gearBtn" title="Settings">⚙</button>
        <button class="ibtn" id="collapseBtn" title="Collapse">▾</button>
      </div>
    </div>

    <div class="settings" id="settings">
      <div class="setrow"><span class="grow">Solid background</span><div class="toggle" id="solidToggle"></div></div>
      <div class="setrow"><span>Opacity</span><input type="range" id="opacity" min="40" max="100" value="100"><span id="opval" style="width:34px;text-align:right;">100%</span></div>
      <div class="setrow"><span>HUD size</span><input type="range" id="scale" min="55" max="115" value="100"><span id="scaleval" style="width:34px;text-align:right;">100%</span></div>
      <button class="linkbtn" id="openPanelBtn">Open control panel ↗</button>
    </div>

    <button id="pendingReview" class="pending-review" hidden></button><div class="bars">
      <div class="bar-row"><span class="bar-label">XP</span><div class="bar"><span id="xpfill" style="width:0%"></span></div><span class="bar-val" id="xpval">0 / 100</span></div>
      <div class="gold-line"><span>◉</span><span class="g" id="gold">0</span><span>gold</span></div>
    </div>

    <div class="collapsible" style="display:flex;flex-direction:column;gap:9px;flex:1;min-height:0;">
      <div class="pager">
        <button class="arrow" id="prevLens" title="Previous">‹</button>
        <div class="lens"><span class="nm" id="lensName">Focus</span><span class="ct" id="lensCount">0</span></div>
        <button class="funnel" id="filterBtn" title="Filter by category">⊝</button>
        <button class="arrow" id="nextLens" title="Next">›</button>
      </div>
      <div class="dots" id="lensDots"></div>
      <div class="catfilter" id="catFilter"></div>

      <div class="scroll quests" id="questList"></div>

      <div class="add"><input id="addInput" type="text" placeholder="New quest…  press Enter" /><button id="addBtn" title="Add quest">+</button></div>

      <div>
        <div class="sec-title">Stats</div>
        <div class="stats">
          <div class="stat"><div class="v" id="s-done">0</div><div class="k">Quests</div></div>
          <div class="stat"><div class="v" id="s-time">0m</div><div class="k">Time</div></div>
        </div>
      </div>
      <div>
        <div class="sec-title">Achievements</div>
        <div class="ach" id="achList"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">LEVEL UP</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="quest-core.js"></script><script src="planner-core.js"></script><script src="ui-common.js"></script><script src="hud-ui.js"></script></body></html>
